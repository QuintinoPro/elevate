name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O Pages serve este repo em /elevate/, então o build precisa saber disso.
      # Quando houver domínio próprio: apagar as duas env e adicionar o CNAME.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /elevate
          NEXT_PUBLIC_SITE_URL: https://quintinopro.github.io/elevate

      # Sem enablement: true — o Pages é habilitado uma vez na mão, em
      # Settings > Pages > Source: GitHub Actions. Tentar habilitar daqui falha,
      # porque o GITHUB_TOKEN do workflow não tem essa permissão.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
