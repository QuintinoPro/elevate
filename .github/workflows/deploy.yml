name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Domínio próprio desde 14/09/2026: o site vive na raiz, então não há
      # BASE_PATH. Quem diz ao Pages qual é o domínio é o public/CNAME, que o
      # export copia pra dentro de out/ — apagar aquele arquivo derruba o
      # domínio no próximo deploy.
      #
      # NEXT_PUBLIC_INDEXAVEL segue fora: a página só entra no Google quando
      # alguém puser `NEXT_PUBLIC_INDEXAVEL: '1'` aqui, de propósito. Hoje ela
      # ainda anuncia parcela não confirmada no checkout e a peneira não grava
      # lead nenhum.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://elevateleague.com.br

      # Sem enablement: true — o Pages é habilitado uma vez na mão, em
      # Settings > Pages > Source: GitHub Actions. Tentar habilitar daqui falha,
      # porque o GITHUB_TOKEN do workflow não tem essa permissão.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
